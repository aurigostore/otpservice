<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLS OTP CHANGE EMAIL</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat font Inter dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Animasi untuk ikon loading/spinner */
        @keyframes spin { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        .spinner {
            border: 2px solid #f3f3f3; /* Lingkaran abu-abu muda */
            border-top: 2px solid #6366f1; /* Warna ungu untuk bagian yang berputar */
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-gray-900 text-slate-800 dark:text-gray-200 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md mx-auto p-4">
        <!-- Kartu utama aplikasi -->
        <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg text-center">
            
            <h1 class="text-xl font-bold text-slate-900 dark:text-white mb-2">
                <span class="bg-gradient-to-r from-purple-500 to-pink-500 text-transparent bg-clip-text">TOOLS OTP CHANGE EMAIL</span>
            </h1>
            <!-- DIUBAH: Teks deskripsi diperbarui -->
            <p class="text-sm text-slate-500 dark:text-gray-400 mb-6">Masukkan email untuk memantau OTP dari CapCut & Canva.</p>

            <div class="space-y-4">
                <!-- DIHAPUS: Pilihan Layanan (CapCut/Canva) sudah tidak ada -->

                <!-- Form input untuk satu email -->
                <input type="email" id="email-input" class="w-full text-center text-sm bg-slate-100 dark:bg-gray-700 border-slate-300 dark:border-gray-600 text-slate-900 dark:text-white rounded-lg p-3 focus:ring-2 focus:ring-purple-500 focus:border-purple-500" placeholder="contoh@mixmail.site">
                
                <!-- Tombol untuk memulai pengecekan -->
                <button id="check-otp-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                    <span>Cek OTP</span>
                </button>
            </div>

            <!-- Area untuk menampilkan status dan hasil -->
            <div id="result-container" class="mt-6 min-h-[80px] bg-slate-100 dark:bg-gray-700 rounded-lg p-4 flex items-center justify-center text-center">
                 <p id="status-text" class="text-slate-500 dark:text-gray-400 text-sm">Hasil akan muncul di sini...</p>
            </div>

        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Konfigurasi Aplikasi ---
    const POLLING_INTERVAL = 2000;
    const MONITORING_DURATION = 30000;
    const API_BASE_URL = "https://mixmail.site/api/messages";

    const SERVICE_CONFIGS = {
        capcut: {
            name: "CapCut",
            senders: ['capcut', 'admin@mail.capcut.com'],
            subjectKeywords: ['kode', 'verifikasi', 'capcut', 'code', 'verification', 'welcome'],
            otpPatterns: [
                /Your verification code:\s*(\d{6})/gi,
                /your verification code is\s*(\d{6})/gi,
                /\b(\d{6})\b/g
            ]
        },
        canva: {
            name: "Canva",
            senders: ['canva', 'no-reply@canva', 'noreply@canva', 'notification@canva', 'verify@canva'],
            subjectKeywords: ['kode', 'masuk', 'verifikasi', 'pendaftaran', 'adalah', 'code', 'login', 'verification', 'sign', 'register', 'otp', 'verify', 'canva'],
            otpPatterns: [
                /(?:kode\s+(?:anda|verifikasi)\s+adalah)\s*[::\s]*(\d{4,8})/gi,
                /(?:your\s+(?:code|otp|verification\s+code)\s+is)\s*[::\s]*(\d{4,8})/gi,
                /code|otp|kode\s*:[\s]*(\d{4,8})/gi,
                /\b(\d{6})\b/g
            ]
        }
    };

    let currentMonitor = null;
    let usedMessageIds = new Set();

    const emailInput = document.getElementById('email-input');
    const checkOtpBtn = document.getElementById('check-otp-btn');
    const resultContainer = document.getElementById('result-container');

    function copyToClipboard(text, buttonElement) {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);
        try {
            document.execCommand('copy');
            if (buttonElement) {
                const originalText = buttonElement.textContent;
                buttonElement.textContent = 'Tersalin!';
                buttonElement.disabled = true;
                setTimeout(() => {
                    buttonElement.textContent = originalText;
                    buttonElement.disabled = false;
                }, 2000);
            }
        } catch (err) {
            console.error('Gagal menyalin teks: ', err);
        }
        document.body.removeChild(tempInput);
    }

    function updateUI(state, data = {}) {
        switch (state) {
            case 'idle':
                resultContainer.innerHTML = '<p id="status-text" class="text-slate-500 dark:text-gray-400 text-sm">Hasil akan muncul di sini...</p>';
                checkOtpBtn.disabled = false;
                checkOtpBtn.querySelector('span').textContent = 'Cek OTP';
                if (checkOtpBtn.querySelector('.spinner')) checkOtpBtn.querySelector('.spinner').remove();
                break;
            case 'monitoring':
                resultContainer.innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <div class="spinner"></div>
                        <p class="text-sm font-medium text-yellow-500">Memantau inbox...</p>
                        <p class="text-xs font-mono">${data.email}</p>
                    </div>`;
                checkOtpBtn.disabled = true;
                checkOtpBtn.querySelector('span').textContent = 'Memantau...';
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                checkOtpBtn.prepend(spinner);
                break;
            case 'success':
                const newestOtpData = data.otps[0];
                const otherOtpsData = data.otps.slice(1);
                
                let resultsHtml = `<div class="w-full text-left space-y-3">
                    <p class="text-sm font-medium text-green-500 text-center">✅ OTP Ditemukan!</p>`;
                
                resultsHtml += `
                    <div class="bg-slate-200 dark:bg-gray-800 p-3 rounded-lg">
                        <p class="text-3xl font-bold tracking-widest text-slate-800 dark:text-white text-center">${newestOtpData.otp}</p>
                        <p class="text-xs text-slate-600 dark:text-gray-300 mt-2 truncate" title="${newestOtpData.subject}">
                            <strong>Subjek:</strong> ${newestOtpData.subject}
                        </p>
                        <p class="text-xs text-slate-500 dark:text-gray-400 truncate" title="${newestOtpData.from}">
                            <strong>Dari:</strong> ${newestOtpData.from}
                        </p>
                        <button id="copy-otp-btn" data-otp="${newestOtpData.otp}" class="mt-3 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300 text-xs">
                            Salin OTP Terbaru
                        </button>
                    </div>`;
                
                if (otherOtpsData.length > 0) {
                    resultsHtml += `<p class="text-xs text-slate-500 dark:text-gray-400 pt-2 text-center">Kode lain yang ditemukan:</p>`;
                    otherOtpsData.forEach(otpData => {
                        resultsHtml += `
                        <div class="bg-slate-200 dark:bg-gray-800 p-3 rounded-lg opacity-80">
                            <p class="text-xl font-bold tracking-widest text-slate-700 dark:text-gray-200 text-center">${otpData.otp}</p>
                            <p class="text-xs text-slate-600 dark:text-gray-300 mt-2 truncate" title="${otpData.subject}">
                                <strong>Subjek:</strong> ${otpData.subject}
                            </p>
                            <p class="text-xs text-slate-500 dark:text-gray-400 truncate" title="${otpData.from}">
                                <strong>Dari:</strong> ${otpData.from}
                            </p>
                        </div>`;
                    });
                }
                resultsHtml += '</div>';
                resultContainer.innerHTML = resultsHtml;

                checkOtpBtn.disabled = false;
                checkOtpBtn.querySelector('span').textContent = 'Cek Lagi';
                if (checkOtpBtn.querySelector('.spinner')) checkOtpBtn.querySelector('.spinner').remove();
                break;
            case 'failed':
                resultContainer.innerHTML = `
                    <div class="flex flex-col items-center gap-1">
                        <p class="text-sm font-medium text-red-500">❌ Gagal</p>
                        <p class="text-xs text-slate-500 dark:text-gray-400">${data.message}</p>
                    </div>`;
                checkOtpBtn.disabled = false;
                checkOtpBtn.querySelector('span').textContent = 'Coba Lagi';
                if (checkOtpBtn.querySelector('.spinner')) checkOtpBtn.querySelector('.spinner').remove();
                break;
        }
    }

    function isTargetEmail(msg, config) {
        const fromLower = (msg.from || '').toLowerCase();
        const subjectLower = (msg.subject || '').toLowerCase();
        const isSenderMatch = config.senders.some(s => fromLower.includes(s));
        const isSubjectMatch = config.subjectKeywords.some(k => subjectLower.includes(k));
        return isSenderMatch || isSubjectMatch;
    }

    function extractOTPCodes(content, subject = '', config) {
        let otpMatches = new Set();
        const combinedText = subject + " " + content.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
        config.otpPatterns.forEach(pattern => {
            pattern.lastIndex = 0;
            let match;
            while ((match = pattern.exec(combinedText)) !== null) {
                if (match[1]) otpMatches.add(match[1]);
                else if (match[0].length >= 4 && match[0].length <= 8 && /^\d+$/.test(match[0])) {
                     otpMatches.add(match[0]);
                }
            }
        });
        return [...otpMatches].filter(otp => otp && !/^(.)\1+$/.test(otp));
    }

    // DIUBAH: Logika pengecekan multi-service
    async function pollInbox(email) {
        if (!currentMonitor) return;
        try {
            const response = await fetch(`${API_BASE_URL}/${email}/dityageng`);
            if (!response.ok) return;
            
            const messages = await response.json();
            const allFoundOtps = [];

            for (const msg of messages) {
                if (!msg || !msg.id || !msg.content) continue;
                
                const isNewMessage = !usedMessageIds.has(msg.id);
                if (!isNewMessage) continue;

                // Cek pesan terhadap setiap konfigurasi layanan yang ada
                let detectedConfig = null;
                if (isTargetEmail(msg, SERVICE_CONFIGS.capcut)) {
                    detectedConfig = SERVICE_CONFIGS.capcut;
                } else if (isTargetEmail(msg, SERVICE_CONFIGS.canva)) {
                    detectedConfig = SERVICE_CONFIGS.canva;
                }

                if (detectedConfig) {
                    usedMessageIds.add(msg.id);
                    const foundOtpsInMsg = extractOTPCodes(msg.content, msg.subject, detectedConfig);
                    
                    if (foundOtpsInMsg.length > 0) {
                        foundOtpsInMsg.forEach(otpCode => {
                            allFoundOtps.push({
                                otp: otpCode,
                                subject: msg.subject || 'Tidak ada subjek',
                                from: msg.from || 'Tidak ada pengirim'
                            });
                        });
                    }
                }
            }

            if (allFoundOtps.length > 0) {
                stopMonitor('success', { otps: allFoundOtps });
                return;
            }

        } catch (error) {
            console.error("Gagal saat polling:", error);
        }
    }

    function startMonitor(email) {
        if (currentMonitor) {
            stopMonitor('idle');
        }
        
        usedMessageIds.clear();
        updateUI('monitoring', { email });

        const intervalId = setInterval(() => pollInbox(email), POLLING_INTERVAL);
        const timeoutId = setTimeout(() => stopMonitor('failed', { message: 'Waktu habis, tidak ada OTP ditemukan.' }), MONITORING_DURATION);

        currentMonitor = { intervalId, timeoutId };
    }

    function stopMonitor(reason, data = {}) {
        if (!currentMonitor) return;
        clearInterval(currentMonitor.intervalId);
        clearTimeout(currentMonitor.timeoutId);
        currentMonitor = null;
        updateUI(reason, data);
    }
    
    checkOtpBtn.addEventListener('click', () => {
        const email = emailInput.value.trim();
        if (!email || !email.includes('@')) {
            updateUI('failed', { message: 'Harap masukkan alamat email yang valid.' });
            return;
        }
        
        startMonitor(email);
    });

    resultContainer.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'copy-otp-btn') {
            const otpToCopy = e.target.dataset.otp;
            if (otpToCopy) {
                copyToClipboard(otpToCopy, e.target);
            }
        }
    });

});
</script>

</body>
</html>
